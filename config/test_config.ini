# Functional test configuration
# Example active contract for the current broker test environment.
# Prefer passing --instrument explicitly because contracts expire.
Test.Instrument=au2612
Test.TimeoutSeconds=12

# Read-only 1.2 market/position snapshot. CLI --instrument overrides Test.Instrument.
Snapshot.TimeoutSeconds=120
Snapshot.MaxPositions=10

# 2.3 connection-state monitoring. Reconnect/caught-up can take longer than the generic timeout.
Reconnect.SessionTimeoutSeconds=120
Reconnect.DisconnectTimeoutSeconds=30
Reconnect.ReconnectTimeoutSeconds=120

# Timeouts shared by live basic-trade and order/cancel-count workflows.
# The 3.2.2 basic-trade test always uses six separate one-lot orders:
# 2 opening fills, 2 individual cancellations, and 2 closing fills.
Trade.SessionTimeoutSeconds=120
Trade.ActionTimeoutSeconds=30
# Before final counting, require the session to remain ready and keep receiving
# owned-order callbacks until no callback arrives for this many milliseconds.
# The whole wait is bounded by ActionTimeoutSeconds.
Trade.CallbackQuietMilliseconds=2000
# Pricing controls used by live basic-trade / order-count / batch-cancel tests.
Trade.AggressiveTicks=2
Trade.WorkingOrderOffsetTicks=50

# 2.6 threshold tests
Threshold.OrderCount=3
Threshold.CancelCount=2
Threshold.DuplicateCount=2

# 2.8 insufficient-funds case. Must be tuned for the broker test account.
# Keep within exchange MaxLimitOrderVolume; if this does not exhaust funds,
# run the case with a suitable account/contract/volume agreed with the broker.
ErrorTest.InsufficientFundsVolume=10
