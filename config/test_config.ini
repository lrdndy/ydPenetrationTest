# Functional test configuration
# Example active contract for the current broker test environment.
# Prefer passing --instrument explicitly because contracts expire.
Test.Instrument=au2612
Test.TimeoutSeconds=12

# Read-only 1.2 market/position snapshot. CLI --instrument overrides Test.Instrument.
Snapshot.TimeoutSeconds=120
Snapshot.MaxPositions=10

# 2.3 connection-state monitoring. Reconnect/caught-up can take longer than the generic timeout.
Reconnect.SessionTimeoutSeconds=120
Reconnect.DisconnectTimeoutSeconds=30
Reconnect.ReconnectTimeoutSeconds=120

# Timeouts shared by live basic-trade and order/cancel-count workflows.
# The 3.2.2 basic-trade test always uses six separate one-lot orders:
# 2 opening fills, 2 individual cancellations, and 2 closing fills.
Trade.SessionTimeoutSeconds=120
Trade.ActionTimeoutSeconds=30
# Before final counting, require the session to remain ready and keep receiving
# owned-order callbacks until no callback arrives for this many milliseconds.
# The whole wait is bounded by ActionTimeoutSeconds.
Trade.CallbackQuietMilliseconds=2000
# Position safety is automatic and cannot be disabled. With UseTodayPosition=true,
# historical speculative longs are allowed only when baseline today/other longs are
# zero; owned closes use CLOSE_TODAY. Otherwise baseline total long must be zero.
# Pricing controls used by live basic-trade / order-count / batch-cancel tests.
Trade.AggressiveTicks=2
Trade.WorkingOrderOffsetTicks=50

# 2.10 test point 2: place two one-lot wholly-unfilled working orders and
# cancel both with one cancelMultiOrders call. Keep this comfortably passive.
BatchCancel.WorkingOrderOffsetTicks=50

# 2.5 duplicate-instruction monitoring samples. These instructions enter the
# local monitoring component only; they are never submitted to the YD API.
Duplicate.RepeatCount=2
Duplicate.Price=500.0
Duplicate.Volume=3

# 2.6 runtime risk thresholds. Every YdSession loads these values; 0 disables
# the corresponding alert. Keep positive values at or below 10 for evidence runs.
Threshold.OrderCount=3
Threshold.CancelCount=2
Threshold.DuplicateCount=2
# Set true for terminal ALERT + a topmost Windows warning dialog.
Threshold.PopupEnabled=true

# 2.7 continuously feed each invalid instruction class this many times.
# YdSession validation rejects them before any YD insertOrder API call.
Validation.InvalidInstrument=au2617
Validation.ReferenceInstrument=au2612
Validation.RepeatCount=3

# 2.8 insufficient-funds case. Submit multiple small BUY OPEN orders and keep
# accepted unfilled orders working until the first cabinet error or this limit.
# Per-order volume must stay within the contract limit. The program verifies
# that the maximum cumulative volume fits its configured restore capacity.
ErrorTest.InsufficientFundsOrderVolume=1
ErrorTest.InsufficientFundsMaxOrders=100
# Minimum interval between adjacent real order submissions. Valid range: 100..60000 ms.
ErrorTest.InsufficientFundsOrderIntervalMilliseconds=500
# Upper bound for emergency close attempts if any of these passive orders trades.
# Keep at least ceil(MaxOrders * OrderVolume / contract MaxLimitOrderVolume).
ErrorTest.InsufficientFundsMaxRestoreAttempts=100
# Keep every trigger order away from the current opposite quote. After the
# first cabinet error (or the order limit), the program cancels all owned
# working orders before reconciling any callback-attributable position.
ErrorTest.PassiveOffsetTicks=50
# 0 means derive a legal passive price from market data. For an after-hours
# market-state run with no quote snapshot, set a legal price for the contract.
ErrorTest.OrderPrice=0
ErrorTest.ActionTimeoutSeconds=30
# Used only by the single-order 2.8.2/2.8.3 compatibility paths.
ErrorTest.MaxRestoreAttempts=3
